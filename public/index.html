<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loan Eligibility Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --card: #171a23; --border: #262a36; --text: #e9ebf1;
    --muted: #9aa1b4; --accent: #6d8dff; --green: #33c17f; --red: #ef5a6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat { font-size: 28px; font-weight: 700; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
  form label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  form input, form select {
    width: 100%; padding: 8px 10px; background: #10131b; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-size: 14px;
  }
  button {
    margin-top: 16px; width: 100%; padding: 10px; background: var(--accent); border: none;
    color: white; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover { opacity: .9; }
  #result { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; }
  #result.approved { background: rgba(51,193,127,.12); border: 1px solid var(--green); }
  #result.rejected { background: rgba(239,90,111,.12); border: 1px solid var(--red); }
  #result .verdict { font-size: 18px; font-weight: 700; }
  canvas { max-height: 260px; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .error { color: var(--red); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Loan Eligibility Dashboard</h1>
  <div class="sub">RandomForest model &middot; served via FastAPI + Pydantic</div>

  <div class="grid" id="summaryCards"></div>

  <div class="two-col">
    <div class="card">
      <h3>Approval rate by property area</h3>
      <canvas id="areaChart"></canvas>
    </div>
    <div class="card">
      <h3>Feature importance</h3>
      <canvas id="featureChart"></canvas>
    </div>
  </div>

  <div class="two-col" style="margin-top:20px;">
    <div class="card">
      <h3>Check eligibility</h3>
      <form id="predictForm">
        <label>Gender</label>
        <select name="gender"><option>Male</option><option>Female</option></select>

        <label>Married</label>
        <select name="married"><option>Yes</option><option>No</option></select>

        <label>Dependents</label>
        <input type="number" name="dependents" value="0" min="0" max="10" />

        <label>Education</label>
        <select name="education"><option>Graduate</option><option>Not Graduate</option></select>

        <label>Self Employed</label>
        <select name="self_employed"><option>No</option><option>Yes</option></select>

        <label>Applicant Income (monthly)</label>
        <input type="number" name="applicant_income" value="5000" min="1" />

        <label>Coapplicant Income (monthly)</label>
        <input type="number" name="coapplicant_income" value="0" min="0" />

        <label>Loan Amount (thousands)</label>
        <input type="number" name="loan_amount" value="120" min="1" />

        <label>Loan Term (days)</label>
        <input type="number" name="loan_amount_term" value="360" min="1" />

        <label>Credit History</label>
        <select name="credit_history"><option value="1">Good (1)</option><option value="0">Bad (0)</option></select>

        <label>Property Area</label>
        <select name="property_area"><option>Urban</option><option>Semiurban</option><option>Rural</option></select>

        <button type="submit">Predict</button>
      </form>
      <div id="result"></div>
      <div id="formError" class="error"></div>
    </div>

    <div class="card">
      <h3>Model performance</h3>
      <div id="metricsBox" style="font-size:14px; line-height:1.9;"></div>
      <canvas id="confusionChart"></canvas>
    </div>
  </div>

<script>
const API = ""; // same-origin on Vercel

async function fetchJSON(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({detail: res.statusText}));
    throw new Error(JSON.stringify(err.detail));
  }
  return res.json();
}

function card(title, value, color) {
  return `<div class="card"><h3>${title}</h3><div class="stat" style="color:${color||'inherit'}">${value}</div></div>`;
}

async function loadSummary() {
  const s = await fetchJSON("/api/dataset-summary");
  document.getElementById("summaryCards").innerHTML = [
    card("Total records", s.total_records),
    card("Approval rate", s.approval_rate + "%", "#33c17f"),
    card("Avg applicant income", "₹" + Math.round(s.avg_applicant_income).toLocaleString()),
    card("Avg loan amount", Math.round(s.avg_loan_amount) + "k"),
  ].join("");

  new Chart(document.getElementById("areaChart"), {
    type: "bar",
    data: {
      labels: Object.keys(s.by_property_area),
      datasets: [{ label: "Approval %", data: Object.values(s.by_property_area), backgroundColor: "#6d8dff" }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
  });
}

async function loadMetrics() {
  const m = await fetchJSON("/api/metrics");
  document.getElementById("metricsBox").innerHTML = `
    Test accuracy: <b>${m.test_accuracy.toFixed(1)}%</b><br/>
    Cross-val accuracy: <b>${m.cv_accuracy.toFixed(1)}%</b>
  `;

  new Chart(document.getElementById("featureChart"), {
    type: "bar",
    data: {
      labels: m.feature_importance.map(f => f.feature),
      datasets: [{ label: "Importance", data: m.feature_importance.map(f => f.importance), backgroundColor: "#33c17f" }]
    },
    options: { indexAxis: "y", plugins: { legend: { display: false } } }
  });

  const cm = m.confusion_matrix;
  new Chart(document.getElementById("confusionChart"), {
    type: "bar",
    data: {
      labels: ["True Neg", "False Pos", "False Neg", "True Pos"],
      datasets: [{ label: "Count", data: [cm[0][0], cm[0][1], cm[1][0], cm[1][1]], backgroundColor: ["#ef5a6f","#ef5a6f88","#ef5a6f88","#33c17f"] }]
    },
    options: { plugins: { legend: { display: false } } }
  });
}

document.getElementById("predictForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  payload.dependents = parseInt(payload.dependents);
  payload.applicant_income = parseFloat(payload.applicant_income);
  payload.coapplicant_income = parseFloat(payload.coapplicant_income);
  payload.loan_amount = parseFloat(payload.loan_amount);
  payload.loan_amount_term = parseFloat(payload.loan_amount_term);
  payload.credit_history = parseInt(payload.credit_history);

  const errBox = document.getElementById("formError");
  const resultBox = document.getElementById("result");
  errBox.textContent = "";
  try {
    const r = await fetchJSON("/api/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    resultBox.style.display = "block";
    resultBox.className = r.approved ? "approved" : "rejected";
    resultBox.innerHTML = `
      <div class="verdict">${r.approved ? "✅ Likely Approved" : "❌ Likely Rejected"}</div>
      <div style="margin-top:6px; color:var(--muted); font-size:13px;">
        Approval probability: ${(r.approval_probability*100).toFixed(1)}% &middot;
        Rejection probability: ${(r.rejection_probability*100).toFixed(1)}%
      </div>`;
  } catch (err) {
    errBox.textContent = "Error: " + err.message;
  }
});

loadSummary();
loadMetrics();
</script>
</body>
</html>
